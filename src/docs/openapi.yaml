openapi: 3.0.3
info:
  title: 库存调拨规划器 API
  version: 1.0.0
  description: |
    库存调拨规划器提供完整的调拨申请、库存约束检查、调拨方案生成与确认、多仓自动分配、
    仓库管理、SKU 管理、库存管理及调拨记录查询等能力。

    **主要模块：**
    - 仓库管理 (`/api/warehouses`)
    - SKU 管理 (`/api/skus`)
    - 库存管理 (`/api/inventory`)
    - 调拨申请 (`/api/transfer-requests`)
    - 调拨方案 (`/api/transfer-plans`)
    - 调拨记录 (`/api/transfer-records`)

    **约束分级：**
    - `FATAL`：不可通过，阻断调拨
    - `WARNING`：可确认但需业务复核
    - `INFO`：提示性信息

    **调拨方案状态机：**
    - `PENDING`（待确认）→ `CONFIRMED`（已确认）→ `COMPLETED`（已完成）
    - `PENDING` → `REJECTED`（已驳回）
    - 任意状态 → `CANCELLED`（已取消）
  contact:
    name: Inventory Ops Team
servers:
  - url: http://localhost:3000
    description: 本地开发环境
  - url: /
    description: 当前部署
tags:
  - name: Health
    description: 健康检查与服务信息
  - name: Warehouses
    description: 仓库管理（CRUD、停用保护、库存子资源）
  - name: SKUs
    description: 商品 SKU 管理（分类、规格、单位）
  - name: Inventory
    description: 库存管理（查询、调整、安全库存、低库存告警）
  - name: Transfer Requests
    description: 调拨申请（创建、更新、提交、取消、约束检查）
  - name: Transfer Plans
    description: 调拨方案（生成、确认、驳回、执行、删除）
  - name: Transfer Records
    description: 调拨记录（历史查询、汇总统计、出入库方向）
paths:
  /api/health:
    get:
      tags: [Health]
      summary: 服务健康检查
      operationId: getHealth
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: 库存调拨规划器 }
                  version: { type: string, example: 1.0.0 }
                  timestamp: { type: string, format: date-time }
  /api/warehouses:
    get:
      tags: [Warehouses]
      summary: 查询仓库列表
      operationId: listWarehouses
      parameters:
        - $ref: '#/components/parameters/StatusQuery'
        - name: type
          in: query
          schema: { type: string, enum: [CENTER, REGIONAL, NORMAL] }
          description: 仓库类型筛选
        - name: keyword
          in: query
          schema: { type: string, maxLength: 50 }
          description: 关键字搜索（名称/编码/位置）
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 仓库列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Warehouse' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Warehouses]
      summary: 创建仓库
      operationId: createWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreatedResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Warehouse' }
        '400':
          description: 编码重复或必填项缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/warehouses/statuses:
    get:
      tags: [Warehouses]
      summary: 获取仓库状态枚举
      operationId: getWarehouseStatuses
      responses:
        '200':
          description: 枚举字典
  /api/warehouses/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Warehouses]
      summary: 查询单个仓库详情
      operationId: getWarehouse
      responses:
        '200':
          description: 仓库详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Warehouse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Warehouses]
      summary: 更新仓库信息
      operationId: updateWarehouse
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseUpdate' }
      responses:
        '200':
          description: 更新成功
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Warehouses]
      summary: 删除仓库
      operationId: deleteWarehouse
      description: 仅当仓库下无库存记录时允许删除
      responses:
        '200': { description: 删除成功 }
        '400':
          description: 仓库下存在库存记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404': { $ref: '#/components/responses/NotFound' }
  /api/warehouses/{id}/inventory:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Warehouses]
      summary: 查询指定仓库的库存明细
      operationId: listWarehouseInventory
      parameters:
        - name: sku_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: low_stock
          in: query
          schema: { type: boolean }
          description: 仅显示低库存（available<=min_stock）
      responses:
        '200':
          description: 库存明细列表
  /api/skus:
    get:
      tags: [SKUs]
      summary: 查询 SKU 列表
      operationId: listSkus
      parameters:
        - $ref: '#/components/parameters/StatusQuery'
        - name: category
          in: query
          schema: { type: string }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 50 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: SKU 列表
    post:
      tags: [SKUs]
      summary: 创建 SKU
      operationId: createSku
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuCreate' }
      responses:
        '201': { description: 创建成功 }
  /api/skus/categories:
    get:
      tags: [SKUs]
      summary: 获取所有 SKU 分类
      operationId: listSkuCategories
      responses:
        '200':
          description: 分类名称数组
  /api/skus/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [SKUs]
      summary: 查询单个 SKU
      operationId: getSku
      responses:
        '200':
          description: SKU 详情
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [SKUs]
      summary: 更新 SKU
      operationId: updateSku
      responses:
        '200': { description: 更新成功 }
    delete:
      tags: [SKUs]
      summary: 删除 SKU（仅无库存时允许）
      operationId: deleteSku
      responses:
        '200': { description: 删除成功 }
  /api/skus/{id}/inventory:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [SKUs]
      summary: 查询 SKU 全网库存
      operationId: listSkuInventory
      responses:
        '200': { description: 各仓库库存列表 }
  /api/inventory:
    get:
      tags: [Inventory]
      summary: 分页查询库存（多维度筛选）
      operationId: listInventory
      parameters:
        - name: warehouse_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: sku_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: category
          in: query
          schema: { type: string }
        - name: low_stock
          in: query
          schema: { type: boolean }
        - name: keyword
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页库存
    post:
      tags: [Inventory]
      summary: 创建库存记录
      operationId: createInventory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryCreate' }
      responses:
        '201': { description: 创建成功 }
        '400':
          description: 仓库/SKU不存在或组合重复
  /api/inventory/summary:
    get:
      tags: [Inventory]
      summary: 按仓库汇总库存统计
      operationId: getInventorySummary
      parameters:
        - name: warehouse_id
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 汇总信息（SKU数、可用量、预留量、在途量、低库存SKU数）
  /api/inventory/low-stock:
    get:
      tags: [Inventory]
      summary: 低库存告警列表
      operationId: listLowStock
      parameters:
        - name: warehouse_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: threshold
          in: query
          schema: { type: integer, minimum: 0 }
          description: 最低缺口阈值
      responses:
        '200':
          description: 低库存记录（含缺口数量）
  /api/inventory/{warehouse_id}/{sku_id}:
    parameters:
      - name: warehouse_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: sku_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Inventory]
      summary: 查询单条库存（仓库+SKU组合主键）
      operationId: getInventoryItem
      responses:
        '200': { description: 库存详情 }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Inventory]
      summary: 更新单条库存（可用量/预留/在途/安全库存阈值）
      operationId: updateInventoryItem
      responses:
        '200': { description: 更新成功 }
  /api/inventory/adjust:
    post:
      tags: [Inventory]
      summary: 批量调整库存（事务保护）
      operationId: adjustInventory
      description: |
        支持 6 种调整类型：
        - `IN`：入库 → available↑
        - `OUT`：出库 → available↓
        - `RESERVE`：预留 → available↓ / reserved↑
        - `RELEASE`：释放预留 → reserved↓ / available↑
        - `IN_TRANSIT_IN`：目标仓在途入量 → in_transit↑
        - `IN_TRANSIT_OUT`：源仓在途出量 → in_transit↓
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjustments]
              properties:
                adjustments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [warehouse_id, sku_id, qty_change, change_type]
                    properties:
                      warehouse_id: { type: integer, minimum: 1 }
                      sku_id: { type: integer, minimum: 1 }
                      qty_change: { type: integer, minimum: 1 }
                      change_type:
                        type: string
                        enum: [IN, OUT, RESERVE, RELEASE, IN_TRANSIT_IN, IN_TRANSIT_OUT]
                operator: { type: string, maxLength: 50 }
                remark: { type: string, maxLength: 200 }
      responses:
        '200': { description: 调整成功 }
        '400': { description: 调整后数量为负或库存不存在 }
  /api/transfer-requests:
    get:
      tags: [Transfer Requests]
      summary: 查询调拨申请列表
      operationId: listTransferRequests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, PLANNING, APPROVED, PROCESSING, COMPLETED, CANCELLED, REJECTED]
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, NORMAL, HIGH, URGENT]
        - name: source_warehouse_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: target_warehouse_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 50 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200': { description: 分页申请列表 }
    post:
      tags: [Transfer Requests]
      summary: 创建调拨申请
      operationId: createTransferRequest
      description: 支持创建后直接提交（auto_submit=true），不指定source_warehouse_id触发多仓分配
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequestCreate' }
      responses:
        '201': { description: 创建成功 }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/transfer-requests/statuses:
    get:
      tags: [Transfer Requests]
      summary: 获取申请状态枚举
      operationId: getRequestStatuses
      responses:
        '200': { description: 状态字典 }
  /api/transfer-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Transfer Requests]
      summary: 查询申请详情（含明细 + 关联方案）
      operationId: getTransferRequest
      responses:
        '200': { description: 详情 }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Transfer Requests]
      summary: 更新调拨申请
      operationId: updateTransferRequest
      description: 仅 DRAFT/SUBMITTED/PLANNING/REJECTED/CANCELLED 状态可编辑
      responses:
        '200': { description: 更新成功 }
    delete:
      tags: [Transfer Requests]
      summary: 删除调拨申请
      operationId: deleteTransferRequest
      description: 仅 DRAFT/CANCELLED/REJECTED 且无关联方案时可删除
      responses:
        '200': { description: 删除成功 }
  /api/transfer-requests/{id}/submit:
    post:
      tags: [Transfer Requests]
      summary: 提交调拨申请
      operationId: submitTransferRequest
      description: 将 DRAFT/REJECTED 申请状态变更为 SUBMITTED
      responses:
        '200': { description: 提交成功 }
  /api/transfer-requests/{id}/cancel:
    post:
      tags: [Transfer Requests]
      summary: 取消调拨申请
      operationId: cancelTransferRequest
      description: 仅未 COMPLETED/CANCELLED 的申请允许取消
      responses:
        '200': { description: 取消成功 }
  /api/transfer-requests/{id}/check-constraints:
    post:
      tags: [Transfer Requests]
      summary: 预览调拨约束检查（不生成方案）
      operationId: checkRequestConstraints
      responses:
        '200':
          description: 8 类约束检查结果（FATAL/WARNING/INFO）
  /api/transfer-plans:
    get:
      tags: [Transfer Plans]
      summary: 查询调拨方案列表
      operationId: listTransferPlans
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, REJECTED, PROCESSING, COMPLETED, CANCELLED]
        - name: request_id
          in: query
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200': { description: 分页方案列表 }
  /api/transfer-plans/statuses:
    get:
      tags: [Transfer Plans]
      summary: 获取方案状态枚举
      operationId: getPlanStatuses
      responses:
        '200': { description: 状态字典 }
  /api/transfer-plans/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Transfer Plans]
      summary: 查询方案详情（含明细 + 约束违规列表）
      operationId: getTransferPlan
      responses:
        '200': { description: 详情 }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Transfer Plans]
      summary: 删除调拨方案
      operationId: deleteTransferPlan
      description: 仅 PENDING/REJECTED/CANCELLED 可删除
      responses:
        '200': { description: 删除成功 }
  /api/transfer-plans/generate/{requestId}:
    post:
      tags: [Transfer Plans]
      summary: 生成调拨方案
      operationId: generateTransferPlan
      description: 根据申请自动生成方案；未指定源仓时触发多仓分配（中心仓优先+安全库存保护）
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                planner: { type: string, maxLength: 50, description: 规划人 }
      responses:
        '201': { description: 方案已生成 }
        '400':
          description: 申请状态不允许/明细为空
  /api/transfer-plans/{id}/confirm:
    post:
      tags: [Transfer Plans]
      summary: 确认调拨方案
      operationId: confirmTransferPlan
      description: 事务性处理：源仓扣减可用量加在途、目标仓加在途量、写入 transfer_records、状态变更 CONFIRMED
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                review_comment: { type: string, maxLength: 500 }
                operator: { type: string, maxLength: 50 }
      responses:
        '200': { description: 确认成功 }
  /api/transfer-plans/{id}/reject:
    post:
      tags: [Transfer Plans]
      summary: 驳回调拨方案
      operationId: rejectTransferPlan
      description: 仅 PENDING 状态可驳回；若申请无其他 PENDING 方案，申请变为 REJECTED
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [review_comment]
              properties:
                review_comment: { type: string, minLength: 1, maxLength: 500 }
                planner: { type: string, maxLength: 50 }
      responses:
        '200': { description: 驳回成功 }
  /api/transfer-plans/{id}/execute:
    post:
      tags: [Transfer Plans]
      summary: 执行入库（调拨完成）
      operationId: executeTransferPlan
      description: 源仓扣减在途、目标仓在途转可用；方案 → COMPLETED，申请 → COMPLETED
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operator: { type: string, maxLength: 50 }
      responses:
        '200': { description: 入库完成 }
  /api/transfer-records:
    get:
      tags: [Transfer Records]
      summary: 查询调拨记录（分页、多维度筛选）
      operationId: listTransferRecords
      parameters:
        - name: source_warehouse_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: target_warehouse_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: sku_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: plan_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: request_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: start_date
          in: query
          schema: { type: string, format: date }
          description: 操作开始日期（含）
        - name: end_date
          in: query
          schema: { type: string, format: date }
          description: 操作结束日期（含）
        - name: keyword
          in: query
          schema: { type: string, maxLength: 50 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200': { description: 分页记录 }
  /api/transfer-records/summary:
    get:
      tags: [Transfer Records]
      summary: 调拨汇总统计（按方向分组）
      operationId: getTransferRecordSummary
      parameters:
        - name: warehouse_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - name: group_by
          in: query
          schema: { type: string, enum: [warehouse, sku], default: warehouse }
          description: 聚合维度
      responses:
        '200':
          description: 入/出方向汇总数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      outbound:
                        type: array
                        items: { type: object }
                      inbound:
                        type: array
                        items: { type: object }
  /api/transfer-records/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Transfer Records]
      summary: 查询单条调拨记录详情
      operationId: getTransferRecord
      responses:
        '200': { description: 记录详情（含仓库/SKU/方案/申请关联信息） }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    PageSize50:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    StatusQuery:
      name: status
      in: query
      schema: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
  responses:
    ValidationError:
      description: 请求参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    Warehouse:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: WH-BJ }
        name: { type: string, example: 北京中心仓 }
        location: { type: string }
        type: { type: string, enum: [CENTER, REGIONAL, NORMAL] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        min_security_stock: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WarehouseCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 100 }
        location: { type: string, maxLength: 200 }
        type: { type: string, enum: [CENTER, REGIONAL, NORMAL], default: NORMAL }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
        min_security_stock: { type: integer, minimum: 0, default: 0 }
    WarehouseUpdate:
      allOf:
        - $ref: '#/components/schemas/WarehouseCreate'
        - type: object
    SkuCreate:
      type: object
      required: [sku_code, name]
      properties:
        sku_code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        category: { type: string, maxLength: 64 }
        unit: { type: string, maxLength: 16, default: 件 }
        spec: { type: string, maxLength: 200 }
        weight: { type: number, minimum: 0, default: 0 }
        volume: { type: number, minimum: 0, default: 0 }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
    InventoryCreate:
      type: object
      required: [warehouse_id, sku_id]
      properties:
        warehouse_id: { type: integer, minimum: 1 }
        sku_id: { type: integer, minimum: 1 }
        available_qty: { type: integer, minimum: 0, default: 0 }
        reserved_qty: { type: integer, minimum: 0, default: 0 }
        in_transit_qty: { type: integer, minimum: 0, default: 0 }
        min_stock: { type: integer, minimum: 0, default: 0 }
        max_stock: { type: integer, minimum: 0, nullable: true }
    TransferRequestItem:
      type: object
      required: [sku_id, requested_qty]
      properties:
        sku_id: { type: integer, minimum: 1 }
        requested_qty: { type: integer, minimum: 1 }
        unit_price: { type: number, minimum: 0 }
        remark: { type: string, maxLength: 200 }
    TransferRequestCreate:
      type: object
      required: [target_warehouse_id, items]
      properties:
        source_warehouse_id: { type: integer, minimum: 1, description: 不指定则触发多仓自动分配 }
        target_warehouse_id: { type: integer, minimum: 1 }
        request_type: { type: string, enum: [NORMAL, URGENT, EMERGENCY], default: NORMAL }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT], default: NORMAL }
        requester: { type: string, maxLength: 50 }
        department: { type: string, maxLength: 50 }
        reason: { type: string, maxLength: 500 }
        expected_date: { type: string, format: date }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TransferRequestItem' }
        auto_submit: { type: boolean, default: false, description: 创建即提交 }
    ListResponse:
      type: object
      properties:
        data: { type: array }
        total: { type: integer, minimum: 0 }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    CreatedResponse:
      type: object
      properties:
        message: { type: string }
    ErrorBody:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: 面向用户的错误消息 }
        code:
          type: string
          description: 稳定的机器可识别错误码
          example: WAREHOUSE_NOT_FOUND
        requestId:
          type: string
          description: 请求追踪 ID，用于日志关联
        timestamp: { type: string, format: date-time }
    ValidationErrorBody:
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string, example: target_warehouse_id }
                  message: { type: string, example: target_warehouse_id 必填 }
                  value: { type: any }
